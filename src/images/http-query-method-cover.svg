<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">HTTP QUERY method cover</title>
  <desc id="desc">A technical cover image showing QUERY as the safe HTTP method with request content, standardized by RFC 10008.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.52" stop-color="#10233c"/>
      <stop offset="1" stop-color="#0c1a2d"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#f8fafc" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="query" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.045"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#background)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>

  <g opacity="0.7">
    <path d="M80 344 C230 292 282 374 430 316 C586 254 666 176 840 224 C982 263 1030 186 1120 146" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.28"/>
    <path d="M70 96 C226 132 308 60 452 112 C612 170 700 112 836 88 C984 62 1038 108 1134 78" fill="none" stroke="#22c55e" stroke-width="2" stroke-opacity="0.2"/>
  </g>

  <g transform="translate(72 74)">
    <text x="0" y="0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#93c5fd" letter-spacing="3">RFC 10008</text>
    <text x="0" y="76" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="78" font-weight="800" fill="#f8fafc">HTTP</text>
    <text x="0" y="156" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="78" font-weight="800" fill="#7dd3fc">QUERY</text>
    <text x="4" y="200" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" fill="#cbd5e1">Safe requests with structured content</text>

    <g transform="translate(0 240)">
      <rect x="0" y="0" width="98" height="34" rx="6" fill="#dcfce7" opacity="0.95"/>
      <text x="49" y="23" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#14532d">SAFE</text>

      <rect x="112" y="0" width="142" height="34" rx="6" fill="#dbeafe" opacity="0.95"/>
      <text x="183" y="23" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1e3a8a">IDEMPOTENT</text>

      <rect x="268" y="0" width="124" height="34" rx="6" fill="#fef3c7" opacity="0.95"/>
      <text x="330" y="23" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#78350f">CACHEABLE</text>
    </g>
  </g>

  <g transform="translate(620 64)" filter="url(#shadow)">
    <rect x="0" y="0" width="500" height="292" rx="12" fill="url(#panel)" stroke="#dbeafe" stroke-opacity="0.18"/>
    <rect x="24" y="24" width="452" height="54" rx="8" fill="#020617" opacity="0.72" stroke="#38bdf8" stroke-opacity="0.45"/>
    <text x="46" y="58" font-family="Consolas, 'Courier New', monospace" font-size="20" font-weight="700" fill="#7dd3fc">QUERY /api/v1/users</text>

    <g transform="translate(38 106)">
      <text x="0" y="0" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#bfdbfe">Content-Type: application/json</text>
      <text x="0" y="32" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#bfdbfe">Accept: application/json</text>

      <rect x="0" y="58" width="424" height="104" rx="8" fill="#020617" opacity="0.62" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="22" y="90" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#e2e8f0">{</text>
      <text x="44" y="118" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#e2e8f0">"filter": { "status": "active" },</text>
      <text x="44" y="146" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#e2e8f0">"page": { "number": 1, "size": 50 }</text>
      <text x="22" y="174" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#e2e8f0">}</text>
    </g>
  </g>

  <g transform="translate(640 374)">
    <line x1="0" y1="0" x2="390" y2="0" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.55"/>
    <polygon points="390,0 376,-7 376,7" fill="#38bdf8" opacity="0.75"/>
    <text x="0" y="-18" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#cbd5e1">body participates in query semantics and cache keys</text>
  </g>

  <g transform="translate(1084 30)">
    <circle cx="0" cy="0" r="28" fill="url(#query)" opacity="0.92"/>
    <text x="0" y="6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">Q</text>
  </g>
</svg>
