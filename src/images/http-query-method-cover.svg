<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <!-- Dark background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d0d"/>
      <stop offset="60%" style="stop-color:#111118"/>
      <stop offset="100%" style="stop-color:#0a0a14"/>
    </linearGradient>

    <!-- Purple glow gradient for QUERY badge -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#b845f5;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#b845f5;stop-opacity:0"/>
    </radialGradient>

    <!-- Horizontal line fade -->
    <linearGradient id="lineFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#b845f5;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#b845f5;stop-opacity:0.6"/>
      <stop offset="70%" style="stop-color:#b845f5;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#b845f5;stop-opacity:0"/>
    </linearGradient>

    <!-- Scanline mask -->
    <pattern id="scanlines" x="0" y="0" width="1200" height="4" patternUnits="userSpaceOnUse">
      <rect width="1200" height="1" y="0" fill="#ffffff" opacity="0.015"/>
    </pattern>
  </defs>

  <!-- Base background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>

  <!-- Scanline overlay -->
  <rect width="1200" height="400" fill="url(#scanlines)"/>

  <!-- Subtle dot grid -->
  <g opacity="0.07">
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#b845f5"/>
    </pattern>
    <rect width="1200" height="400" fill="url(#dots)"/>
  </g>

  <!-- Left glow blob -->
  <ellipse cx="180" cy="200" rx="180" ry="160" fill="url(#glowGrad)" opacity="0.6"/>

  <!-- Right glow blob -->
  <ellipse cx="1050" cy="200" rx="160" ry="140" fill="url(#glowGrad)" opacity="0.35"/>

  <!-- Top border line -->
  <rect x="0" y="0" width="1200" height="1.5" fill="url(#lineFade)"/>
  <!-- Bottom border line -->
  <rect x="0" y="398" width="1200" height="1.5" fill="url(#lineFade)"/>

  <!-- ── LEFT SECTION: method comparison ── -->

  <!-- Section label -->
  <text x="60" y="72" font-family="'Courier New', monospace" font-size="11" fill="#b845f5" opacity="0.7" letter-spacing="3">HTTP METHODS</text>

  <!-- GET -->
  <rect x="60" y="88" width="120" height="32" rx="4" fill="#0d0d0d" stroke="#4dabf7" stroke-width="1" opacity="0.5"/>
  <text x="120" y="109" font-family="'Courier New', monospace" font-size="13" fill="#4dabf7" text-anchor="middle" opacity="0.6">GET</text>

  <!-- POST -->
  <rect x="60" y="132" width="120" height="32" rx="4" fill="#0d0d0d" stroke="#69db7c" stroke-width="1" opacity="0.5"/>
  <text x="120" y="153" font-family="'Courier New', monospace" font-size="13" fill="#69db7c" text-anchor="middle" opacity="0.6">POST</text>

  <!-- PUT -->
  <rect x="60" y="176" width="120" height="32" rx="4" fill="#0d0d0d" stroke="#ffa94d" stroke-width="1" opacity="0.5"/>
  <text x="120" y="197" font-family="'Courier New', monospace" font-size="13" fill="#ffa94d" text-anchor="middle" opacity="0.6">PUT</text>

  <!-- DELETE -->
  <rect x="60" y="220" width="120" height="32" rx="4" fill="#0d0d0d" stroke="#ff6b6b" stroke-width="1" opacity="0.5"/>
  <text x="120" y="241" font-family="'Courier New', monospace" font-size="13" fill="#ff6b6b" text-anchor="middle" opacity="0.6">DELETE</text>

  <!-- QUERY — highlighted -->
  <rect x="52" y="268" width="136" height="38" rx="5" fill="#b845f5" opacity="0.12"/>
  <rect x="52" y="268" width="136" height="38" rx="5" fill="none" stroke="#b845f5" stroke-width="1.5"/>
  <text x="120" y="292" font-family="'Courier New', monospace" font-size="15" font-weight="bold" fill="#b845f5" text-anchor="middle">QUERY ✦</text>

  <!-- Connector line from QUERY to center -->
  <line x1="188" y1="287" x2="340" y2="287" stroke="#b845f5" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>
  <circle cx="340" cy="287" r="3" fill="#b845f5" opacity="0.5"/>

  <!-- ── CENTER SECTION: main title ── -->

  <!-- Draft badge -->
  <rect x="340" y="90" width="90" height="22" rx="3" fill="#b845f5" opacity="0.15" stroke="#b845f5" stroke-width="1"/>
  <text x="385" y="106" font-family="'Courier New', monospace" font-size="10" fill="#b845f5" text-anchor="middle" letter-spacing="2">IETF DRAFT</text>

  <!-- Main heading -->
  <text x="340" y="175" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#f8f9fa" letter-spacing="-1">HTTP</text>
  <text x="340" y="260" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#b845f5" letter-spacing="-1">QUERY</text>

  <!-- Thin divider under title -->
  <line x1="340" y1="278" x2="720" y2="278" stroke="#b845f5" stroke-width="1" opacity="0.3"/>

  <!-- Subtitle -->
  <text x="340" y="308" font-family="Arial, sans-serif" font-size="16" fill="#6c757d" letter-spacing="1">The missing HTTP method for complex queries</text>

  <!-- ── RIGHT SECTION: property badges ── -->

  <!-- Section label -->
  <text x="820" y="72" font-family="'Courier New', monospace" font-size="11" fill="#b845f5" opacity="0.7" letter-spacing="3">PROPERTIES</text>

  <!-- Safe -->
  <rect x="820" y="88" width="300" height="40" rx="4" fill="#0d0d0d" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08"/>
  <circle cx="848" cy="108" r="6" fill="#b845f5" opacity="0.9"/>
  <text x="866" y="113" font-family="Arial, sans-serif" font-size="14" fill="#e9ecef">Safe</text>
  <text x="1108" y="113" font-family="'Courier New', monospace" font-size="11" fill="#b845f5" text-anchor="end">no side effects</text>

  <!-- Idempotent -->
  <rect x="820" y="140" width="300" height="40" rx="4" fill="#0d0d0d" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08"/>
  <circle cx="848" cy="160" r="6" fill="#b845f5" opacity="0.9"/>
  <text x="866" y="165" font-family="Arial, sans-serif" font-size="14" fill="#e9ecef">Idempotent</text>
  <text x="1108" y="165" font-family="'Courier New', monospace" font-size="11" fill="#b845f5" text-anchor="end">same result always</text>

  <!-- Cacheable -->
  <rect x="820" y="192" width="300" height="40" rx="4" fill="#0d0d0d" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08"/>
  <circle cx="848" cy="212" r="6" fill="#b845f5" opacity="0.9"/>
  <text x="866" y="217" font-family="Arial, sans-serif" font-size="14" fill="#e9ecef">Cacheable</text>
  <text x="1108" y="217" font-family="'Courier New', monospace" font-size="11" fill="#b845f5" text-anchor="end">unlike POST</text>

  <!-- Request Body -->
  <rect x="820" y="244" width="300" height="40" rx="4" fill="#0d0d0d" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08"/>
  <circle cx="848" cy="264" r="6" fill="#b845f5" opacity="0.9"/>
  <text x="866" y="269" font-family="Arial, sans-serif" font-size="14" fill="#e9ecef">Request Body</text>
  <text x="1108" y="269" font-family="'Courier New', monospace" font-size="11" fill="#b845f5" text-anchor="end">structured filters</text>

  <!-- ── BOTTOM STRIP ── -->
  <rect x="0" y="348" width="1200" height="52" fill="#000000" opacity="0.3"/>

  <!-- Tags -->
  <rect x="60" y="362" width="60" height="24" rx="3" fill="#b845f5" opacity="0.9"/>
  <text x="90" y="379" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">HTTP</text>

  <rect x="132" y="362" width="75" height="24" rx="3" fill="none" stroke="#b845f5" stroke-width="1" opacity="0.7"/>
  <text x="169" y="379" font-family="Arial, sans-serif" font-size="12" fill="#b845f5" text-anchor="middle">REST API</text>

  <rect x="219" y="362" width="90" height="24" rx="3" fill="none" stroke="#b845f5" stroke-width="1" opacity="0.7"/>
  <text x="264" y="379" font-family="Arial, sans-serif" font-size="12" fill="#b845f5" text-anchor="middle">Spring Boot</text>

  <rect x="321" y="362" width="55" height="24" rx="3" fill="none" stroke="#b845f5" stroke-width="1" opacity="0.7"/>
  <text x="348" y="379" font-family="Arial, sans-serif" font-size="12" fill="#b845f5" text-anchor="middle">Java</text>

  <!-- Right side: IETF info -->
  <text x="1140" y="379" font-family="'Courier New', monospace" font-size="11" fill="#495057" text-anchor="end">draft-ietf-httpbis-safe-method-w-body</text>
</svg>
